use_default_settings: true

general:
  debug: false
  instance_name: "Private Research SearXNG"

search:
  safe_search: 1
  autocomplete: ""
  ban_time_on_fail: 10
  max_ban_time_on_fail: 10
  suspended_times:
    SearxEngineAccessDenied: 10
    SearxEngineCaptcha: 120
    SearxEngineTooManyRequests: 10
    cf_SearxEngineCaptcha: 300
    cf_SearxEngineAccessDenied: 120
    recaptcha_SearxEngineCaptcha: 300
  formats:
    - html
    - json

engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: presearch
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: microsoft learn
    disabled: false
  - name: crossref
    disabled: false
  - name: openalex
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
  enable_http2: false
  # Per-engine retries multiply one aggregate search into a burst of upstream
  # attempts. The app instead retries the whole exact request once, and only
  # after a transport failure or a completely empty degraded response.
  retries: 0
  keepalive_expiry: 3.0
  using_tor_proxy: true
  extra_proxy_timeout: 10
  proxies:
    all://:
      # Static labels are circuit-isolation tokens, not credentials. SearXNG
      # distributes engine requests round-robin; Tor's IsolateSOCKSAuth keeps
      # those identities on separate circuits.
      - socks5h://search-a:isolate-a@tor-search:9050
      - socks5h://search-b:isolate-b@tor-search:9050
      - socks5h://search-c:isolate-c@tor-search:9050
      - socks5h://search-d:isolate-d@tor-search:9050

ui:
  static_use_hash: true
  query_in_title: false

enabled_plugins:
  - "Hash plugin"
  - "Self Information"
  - "Tracker URL remover"
