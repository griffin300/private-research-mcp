name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, including privacy and quality tradeoffs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy expectations
      options:
        - label: This proposal does not require direct egress, cloud telemetry, or storing raw queries by default.
          required: true
