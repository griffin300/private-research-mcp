[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "private-research-mcp"
version = "0.1.0"
description = "Local, privacy-first web research and evidence MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "mcp[cli]==1.28.1",
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "httpx[socks]==0.28.1",
  "trafilatura==2.0.0",
  "selectolax==0.3.32",
  "readability-lxml==0.8.4.1",
  "python-dateutil==2.9.0.post0",
  "jinja2==3.1.6",
]

[project.optional-dependencies]
ranking = ["fastembed==0.7.3"]
browser = ["playwright==1.54.0"]
dev = [
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "respx==0.22.0",
  "ruff==0.12.5",
  "types-python-dateutil==2.9.0.20250708",
]

[project.scripts]
private-research-mcp = "app.mcp_server:run_stdio"
private-research-http = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_bridge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
cache_dir = "work/pytest-cache"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: local service integration tests",
  "security: security control tests",
  "privacy: Docker network privacy tests",
  "live: tests requiring the live Docker stack and external network",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "mcp_bridge"]
